<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>判断ボード</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --wa-color-brand: #3768a8;
      --wa-color-success: #287d55;
      --wa-color-warning: #a16207;
      --wa-color-danger: #b42318;
      --board-bg: #f5f7fa;
      --board-panel: #ffffff;
      --board-text: #1f2937;
      --board-muted: #667085;
      --board-border: #d8dee8;
      --board-header: rgba(255, 255, 255, .94);
    }
    html.wa-dark {
      --board-bg: #151922;
      --board-panel: #202632;
      --board-text: #edf2f7;
      --board-muted: #a8b3c2;
      --board-border: #3b4656;
      --board-header: rgba(32, 38, 50, .94);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--board-bg); color: var(--board-text); }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; overflow-x: hidden; padding-bottom: calc(var(--footer-height, 64px) + env(safe-area-inset-bottom)); }
    button, input, textarea { font: inherit; }
    wa-button, wa-badge, wa-copy-button, wa-divider, wa-dialog, wa-radio-group, wa-checkbox, wa-rating, wa-slider, wa-number-input, wa-textarea, wa-tab-group, wa-tab, wa-tooltip { --wa-font-family: inherit; }
    .topbar { position: sticky; top: 0; z-index: 10; width: min(760px, calc(100% - 28px)); height: 50px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, .45fr) minmax(0, .55fr) auto; align-items: center; gap: 12px; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); border-bottom: 1px solid var(--board-border); background: var(--board-header); backdrop-filter: blur(10px); }
    .topbar > * { min-width: 0; }
    .topbar .session, .topbar .cwd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .topbar .session > span, .topbar .cwd > span { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .cwd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--board-muted); font-size: .82rem; }
    .topbar wa-badge { white-space: nowrap; }
    main { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 28px; }
    .offline { margin: 0 auto 14px; padding: 7px 10px; border-left: 3px solid var(--wa-color-warning); color: var(--board-muted); font-size: .82rem; background: color-mix(in srgb, var(--wa-color-warning) 9%, var(--board-panel)); }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    h1 { margin: 0 0 18px; font-size: clamp(1.35rem, 4vw, 1.85rem); line-height: 1.35; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    h3 { margin: 0 0 8px; font-size: 1rem; }
    .panel { padding: 16px; background: var(--board-panel); border: 1px solid var(--board-border); border-radius: 10px; }
    .list { display: grid; gap: 8px; }
    .list-row { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 6px; width: 100%; min-width: 0; height: auto !important; padding: 12px 13px; text-align: left; color: inherit; background: var(--board-panel); border: 1px solid var(--board-border); border-radius: 8px; cursor: pointer; }
    .list-row:hover { border-color: var(--wa-color-brand); }
    .list-row > * { min-width: 0; }
    .list-row .row-title { min-width: 0; overflow-wrap: anywhere; }
    .status-mark { color: var(--board-muted); font-size: .8rem; white-space: nowrap; }
    .status-mark.open { color: var(--wa-color-warning); }
    .status-mark.answered { color: var(--wa-color-brand); }
    .status-mark.closed { color: var(--board-muted); }
    .status-mark.pasted { color: var(--wa-color-warning); }
    .row-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; color: var(--board-muted); font-size: .78rem; white-space: normal; }
    .read-list { display: grid; gap: 8px; }
    .read-button { width: 100%; padding: 12px 13px; border: 1px solid var(--board-border); border-radius: 8px; color: inherit; background: var(--board-panel); text-align: left; cursor: pointer; }
    .read-button small { display: block; margin-top: 4px; color: var(--board-muted); }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tabs wa-tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 4px; color: var(--board-muted); background: transparent; cursor: pointer; }
    .tabs wa-tab.active { color: var(--board-text); border-bottom-color: var(--wa-color-brand); }
    .markdown { line-height: 1.7; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .callout { padding: 13px 15px; border-left: 4px solid var(--wa-color-brand); border-radius: 7px; background: color-mix(in srgb, var(--wa-color-brand) 9%, var(--board-panel)); }
    .callout.warning { border-left-color: var(--wa-color-warning); background: color-mix(in srgb, var(--wa-color-warning) 10%, var(--board-panel)); }
    .callout.danger { border-left-color: var(--wa-color-danger); background: color-mix(in srgb, var(--wa-color-danger) 10%, var(--board-panel)); }
    .callout.success { border-left-color: var(--wa-color-success); background: color-mix(in srgb, var(--wa-color-success) 10%, var(--board-panel)); }
    .callout.neutral { border-left-color: var(--board-muted); background: color-mix(in srgb, var(--board-muted) 8%, var(--board-panel)); }
    .option-grid { display: grid; gap: 10px; }
    .option-card { padding: 13px; border: 1px solid var(--board-border); border-radius: 8px; }
    .option-card .option-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .option-card p { margin: 6px 0; color: var(--board-muted); }
    .option-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .88rem; }
    .option-columns ul { margin: 5px 0 0; padding-left: 18px; }
    .table-scroll, .chart-scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
    .table-scroll table { min-width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 10px; border: 1px solid var(--board-border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    th { background: color-mix(in srgb, var(--board-muted) 9%, var(--board-panel)); }
    .chart-inner { min-width: 560px; height: 280px; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 12px; border: 1px solid var(--board-border); border-radius: 8px; }
    .metric-label, .metric-note { color: var(--board-muted); font-size: .82rem; }
    .metric-value { margin: 4px 0; font-size: 1.45rem; font-weight: 650; overflow-wrap: anywhere; }
    .unknown-block { color: var(--board-muted); font-size: .8rem; }
    .answer-box { display: grid; gap: 13px; }
    .answer-prompt { margin: 0; font-weight: 600; }
    .answer-control { display: grid; gap: 7px; }
    .answer-control .range-labels { display: flex; justify-content: space-between; color: var(--board-muted); font-size: .8rem; }
    .answer-control wa-radio-group, .answer-control wa-rating, .answer-control wa-slider, .answer-control wa-number-input, .answer-control wa-textarea { width: 100%; }
    .radio-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-options.vertical { display: grid; }
    .radio-options wa-radio { min-width: 0; }
    .radio-options:not(.vertical) { flex-direction: row !important; }
    .radio-options:not(.vertical) wa-radio { width: fit-content !important; flex: 0 1 auto; }
    .note-label { color: var(--board-muted); font-size: .85rem; }
    .response-view { display: grid; gap: 10px; padding: 13px; border: 1px solid var(--board-border); border-radius: 8px; }
    .response-value { font-weight: 600; overflow-wrap: anywhere; }
    .response-note { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--board-muted); }
    .mermaid-error { color: var(--board-muted); font-size: .8rem; }
    .command-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .command-line code { display: block; padding: 8px; overflow-wrap: anywhere; color: var(--board-text); background: var(--board-bg); border-radius: 5px; }
    .empty { padding: 25px 10px; text-align: center; color: var(--board-muted); }
    .footer { position: fixed; z-index: 11; right: auto; bottom: 0; left: 50%; width: min(760px, calc(100% - 28px)); transform: translateX(-50%); display: flex; justify-content: center; gap: 8px; padding: 9px max(14px, env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); border-top: 1px solid var(--board-border); background: var(--board-header); backdrop-filter: blur(10px); }
    .footer wa-button { min-width: 0; }
    .footer .cancel { margin-left: auto; }
    .footer .send { margin-left: 0; }
    .toast { position: fixed; z-index: 30; right: 14px; bottom: 74px; max-width: min(400px, calc(100% - 28px)); padding: 10px 13px; color: #fff; background: #27364a; border-radius: 7px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .16s, transform .16s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .dialog-copy { display: grid; gap: 10px; }
    .dialog-copy pre { max-height: 45vh; margin: 0; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; background: var(--board-bg); border: 1px solid var(--board-border); }
    @media (max-width: 520px) {
      .topbar { width: min(760px, calc(100% - 20px)); grid-template-columns: minmax(0, .45fr) minmax(0, .55fr) auto; gap: 7px; }
      .topbar .cwd { display: block; }
      main { width: min(100% - 20px, 760px); padding-top: 16px; }
      .panel { padding: 13px; }
      .option-columns, .metric-grid { grid-template-columns: 1fr; }
      .footer { width: min(760px, calc(100% - 20px)); gap: 5px; }
      .footer wa-button { flex: 1; }
      .footer .cancel { margin-left: 0; }
      .footer .send { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div id="session" class="session"></div>
    <div id="cwd" class="cwd"></div>
    <div id="remaining"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status"></div>
  <wa-dialog id="paste-dialog" label="回答を渡してください">
    <div class="dialog-copy">
      <p>受け口がないため、次の本文をコピーしてエージェントへ渡してください。</p>
      <pre id="paste-message"></pre>
      <wa-copy-button id="paste-copy"></wa-copy-button>
    </div>
    <wa-button slot="footer" id="paste-close">閉じる</wa-button>
  </wa-dialog>
  <script id="board-snapshot" type="application/json">{}</script>
  <script>
    (() => {
      'use strict';
      const DAY = 24 * 60 * 60 * 1000;
      const snapshotElement = document.getElementById('board-snapshot');
      let snapshot = {};
      try { snapshot = JSON.parse(snapshotElement.textContent || '{}'); } catch {}
      let board = snapshot && snapshot.board ? snapshot : null;
      let offline = false;
      let renderedKey = '';
      let charts = [];
      let toastTimer;
      const app = document.getElementById('app');
      const footer = document.getElementById('footer');

      function syncFooterSpace() {
        document.documentElement.style.setProperty('--footer-height', `${footer.getBoundingClientRect().height}px`);
      }
      if (window.ResizeObserver) new ResizeObserver(syncFooterSpace).observe(footer);
      window.addEventListener('resize', syncFooterSpace);
      syncFooterSpace();

      function syncTheme() {
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('wa-dark', dark);
        document.documentElement.classList.toggle('wa-light', !dark);
      }
      syncTheme();
      if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

      function getStorage() {
        try { return window.localStorage; } catch { return null; }
      }
      function storageEntries() {
        const storage = getStorage();
        if (!storage) return [];
        const entries = [];
        try {
          for (let i = 0; i < storage.length; i += 1) {
            const key = storage.key(i);
            if (!key || !key.startsWith('dboard:')) continue;
            let value;
            try { value = JSON.parse(storage.getItem(key)); } catch { storage.removeItem(key); continue; }
            entries.push({ key, value });
          }
        } catch {}
        return entries;
      }
      function cleanStorage() {
        const storage = getStorage();
        if (!storage) return;
        const cutoff = Date.now() - 14 * DAY;
        const entries = storageEntries();
        for (const entry of entries) {
          if (!entry.value || typeof entry.value.savedAt !== 'number' || entry.value.savedAt < cutoff) {
            try { storage.removeItem(entry.key); } catch {}
          }
        }
        const current = storageEntries().sort((a, b) => a.value.savedAt - b.value.savedAt);
        for (const entry of current.slice(0, Math.max(0, current.length - 100))) {
          try { storage.removeItem(entry.key); } catch {}
        }
      }
      function draftKey(itemId) { return board ? `dboard:${board.board.id}:${itemId}` : ''; }
      function removeDraft(itemId) {
        const storage = getStorage();
        if (!storage || !draftKey(itemId)) return;
        try { storage.removeItem(draftKey(itemId)); } catch {}
      }
      function readDraft(itemId) {
        const storage = getStorage();
        if (!storage || !draftKey(itemId)) return null;
        try {
          const value = JSON.parse(storage.getItem(draftKey(itemId)) || 'null');
          if (!value || typeof value.savedAt !== 'number' || Date.now() - value.savedAt > 14 * DAY) {
            storage.removeItem(draftKey(itemId));
            return null;
          }
          return value;
        } catch { return null; }
      }
      function saveDraft(item, value, note, state = 'draft') {
        const storage = getStorage();
        if (!storage || !board) return;
        try {
          storage.setItem(draftKey(item.id), JSON.stringify({ value, note, savedAt: Date.now(), state }));
        } catch {}
        cleanStorage();
      }
      function cleanClosedDrafts() {
        if (!board) return;
        for (const item of board.items || []) if (item.status !== 'open') removeDraft(item.id);
        cleanStorage();
      }
      cleanStorage();

      function text(value) {
        const node = document.createElement('span');
        node.textContent = value == null ? '' : String(value);
        return node;
      }
      function node(tag, value, className) {
        const element = document.createElement(tag);
        if (value !== undefined && value !== null) element.textContent = String(value);
        if (className) element.className = className;
        return element;
      }
      function parseMarkdownDocument(value) {
        const source = String(value ?? '');
        const match = source.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
        if (!match) return { body: source, title: '' };
        const titleLine = match[1].split(/\r?\n/).find((line) => /^title\s*:/.test(line));
        let title = titleLine ? titleLine.replace(/^title\s*:\s*/, '').trim() : '';
        if ((title.startsWith('"') && title.endsWith('"')) || (title.startsWith("'") && title.endsWith("'"))) title = title.slice(1, -1);
        return { body: source.slice(match[0].length), title };
      }
      function escapeHtmlAttribute(value) {
        return String(value).replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      }
      function renderMarkdownBlocks(source, parser, depth = 0) {
        const lines = String(source).split(/\r?\n/);
        const output = [];
        const normal = [];
        const flush = () => {
          if (normal.length) {
            output.push(parser(normal.join('\n')));
            normal.length = 0;
          }
        };
        for (let index = 0; index < lines.length; index += 1) {
          const opening = lines[index].match(/^(:{3,})(message|details)(?:\s+(.*?))?\s*$/);
          if (!opening || depth >= 2) {
            normal.push(lines[index]);
            continue;
          }
          flush();
          const closePattern = new RegExp(`^${opening[1]}\\s*$`);
          let closeIndex = -1;
          for (let candidate = index + 1; candidate < lines.length; candidate += 1) {
            if (closePattern.test(lines[candidate])) {
              closeIndex = candidate;
              break;
            }
          }
          const inner = lines.slice(index + 1, closeIndex < 0 ? lines.length : closeIndex).join('\n');
          const innerHtml = renderMarkdownBlocks(inner, parser, depth + 1);
          if (opening[2] === 'message') {
            const variant = opening[3]?.trim() === 'alert' ? 'danger' : 'brand';
            output.push(`<wa-callout variant="${variant}">${innerHtml}</wa-callout>`);
          } else {
            output.push(`<wa-details summary="${escapeHtmlAttribute(opening[3]?.trim() || '')}">${innerHtml}</wa-details>`);
          }
          index = closeIndex < 0 ? lines.length : closeIndex;
        }
        flush();
        return output.join('');
      }
      function mermaidFallback(source) {
        const wrapper = node('div', null, 'mermaid-fallback');
        wrapper.append(node('div', '図を描けませんでした', 'mermaid-error'));
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = source;
        pre.append(code);
        wrapper.append(pre);
        return wrapper;
      }
      function drawMermaid(element) {
        const codeBlocks = [...element.querySelectorAll('code.language-mermaid')].map((code) => ({
          source: code.textContent || '',
          pre: code.closest('pre'),
        })).filter((block) => block.pre);
        if (!codeBlocks.length) return;
        queueMicrotask(async () => {
          const mermaid = window.mermaid;
          if (!mermaid) {
            for (const block of codeBlocks) block.pre.replaceWith(mermaidFallback(block.source));
            return;
          }
          try {
            mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: document.documentElement.classList.contains('wa-dark') ? 'dark' : 'default' });
          } catch {}
          for (const block of codeBlocks) {
            const diagram = node('div', block.source, 'mermaid');
            block.pre.replaceWith(diagram);
            try {
              await mermaid.run({ nodes: [diagram] });
              if (!diagram.querySelector('svg')) throw new Error('mermaid');
            } catch {
              diagram.replaceWith(mermaidFallback(block.source));
            }
          }
        });
      }
      function markdown(value) {
        const element = document.createElement('div');
        element.className = 'markdown';
        const parser = window.marked && (window.marked.parse || (window.marked.marked && window.marked.marked.parse));
        const documentInfo = parseMarkdownDocument(value);
        if (parser && window.DOMPurify) {
          const html = renderMarkdownBlocks(documentInfo.body, parser);
          element.innerHTML = window.DOMPurify.sanitize(html, { ADD_TAGS: ['wa-callout', 'wa-details'], ADD_ATTR: ['variant', 'summary'] });
          drawMermaid(element);
        } else element.textContent = documentInfo.body;
        return element;
      }
      function divider() { return document.createElement('wa-divider'); }
      function dateText(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        return new Intl.DateTimeFormat(undefined, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
      }
      function isPasted(item) { const draft = readDraft(item.id); return item.status === 'open' && draft && draft.state === 'pasted'; }
      function statusText(item) {
        if (isPasted(item)) return '回答済み（未送達）';
        if (item.status === 'open') return '未回答';
        if (item.status === 'answered') return '回答済み（閉じ待ち）';
        return '閉じた';
      }
      function statusClass(item) {
        if (isPasted(item)) return 'pasted';
        return item.status;
      }
      function sortedItems() {
        if (!board) return [];
        return [...(board.items || [])].sort((a, b) => {
          const aOpen = a.status === 'open' && !isPasted(a);
          const bOpen = b.status === 'open' && !isPasted(b);
          if (aOpen !== bOpen) return aOpen ? -1 : 1;
          if (aOpen && bOpen && (a.importance ?? 0) !== (b.importance ?? 0)) return (b.importance ?? 0) - (a.importance ?? 0);
          return String(a.createdAt).localeCompare(String(b.createdAt));
        });
      }
      function openItems() { return sortedItems().filter((item) => item.status === 'open' && !isPasted(item)); }
      function currentRoute() {
        const hash = location.hash || '#/list/decisions';
        const parts = hash.replace(/^#\//, '').split('/');
        if (parts[0] === 'q' && parts[1]) return { type: 'question', id: decodeURIComponent(parts[1]) };
        if (parts[0] === 'r' && parts[1]) return { type: 'read', id: decodeURIComponent(parts[1]) };
        if (parts[0] === 'list' && parts[1] === 'reads') return { type: 'list-reads' };
        return { type: 'list-decisions' };
      }
      function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
      function addTooltip(value, className, id) {
        const anchor = node('span', value, className);
        anchor.id = id;
        const tooltip = document.createElement('wa-tooltip');
        tooltip.setAttribute('trigger', 'click');
        tooltip.setAttribute('for', id);
        tooltip.append(text(value));
        return { anchor, tooltip };
      }
      function renderHeader() {
        const session = document.getElementById('session');
        const cwd = document.getElementById('cwd');
        const remaining = document.getElementById('remaining');
        session.replaceChildren();
        cwd.replaceChildren();
        if (!board) {
          session.textContent = '判断ボード';
          remaining.textContent = '';
          return;
        }
        const sessionTooltip = addTooltip(board.board.session, 'session', 'session-value');
        const cwdTooltip = addTooltip(board.board.cwd, 'cwd', 'cwd-value');
        session.append(sessionTooltip.anchor, sessionTooltip.tooltip);
        cwd.append(cwdTooltip.anchor, cwdTooltip.tooltip);
        const total = (board.items || []).length;
        const remainingCount = openItems().length;
        const badge = document.createElement('wa-badge');
        badge.setAttribute('variant', remainingCount === 0 ? 'success' : 'neutral');
        badge.textContent = remainingCount === 0 ? `すべて回答済み / ${total}` : `残り ${remainingCount} / ${total}`;
        remaining.replaceChildren(badge);
      }
      function renderOffline() {
        const old = document.querySelector('.offline');
        if (old) old.remove();
        if (offline) {

        charts.forEach((chart) => chart.destroy());
        charts = [];
        window.currentForm = null;
        renderHeader();
        app.replaceChildren();
        const route = currentRoute();
        if (!board) app.append(node('div', 'board.json を読み込めません。', 'empty'));
        else if (route.type === 'list-decisions') renderDecisionList();
        else if (route.type === 'list-reads') renderReadList();
        else if (route.type === 'question') {
          const item = board.items.find((candidate) => candidate.id === route.id);
          if (item) renderQuestion(item); else app.append(node('div', '判断が見つかりません。', 'empty'));
        } else {
          const read = (board.reads || []).find((candidate) => candidate.id === route.id);
          if (read) renderRead(read); else app.append(node('div', 'よみものが見つかりません。', 'empty'));
        }
        renderOffline();
        renderFooter(route);
      }
      async function fetchBoard() {
        try {
          const response = await fetch('./board.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('board');
          const incoming = await response.json();
          const changed = !board || board.board.updatedAt !== incoming.board.updatedAt;
          const wasOffline = offline;
          board = incoming;
          offline = false;
          cleanClosedDrafts();
          if (changed || wasOffline) render();
        } catch {
          if (!board && snapshot && snapshot.board) board = snapshot;
          if (!offline) { offline = true; render(); }
        }
      }
      window.addEventListener('hashchange', render);
      document.getElementById('paste-close').addEventListener('click', () => { document.getElementById('paste-dialog').open = false; });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchBoard(); });
      render();
      fetchBoard();
      setInterval(fetchBoard, 5000);
    })();
  </script>
</body>
</html>
